name: Deploy API to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build API
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload build artifact
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail

          tar -czf flenvn-api.tar.gz \
            dist \
            scripts/register-tracing.cjs \
            scripts/backfill-vocabulary-labels.js \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR'"
          scp -i ~/.ssh/ec2_key flenvn-api.tar.gz "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/flenvn-api.tar.gz"

      - name: Restart API on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << EOF
            set -euo pipefail
            cd "$EC2_APP_DIR"
            tar -xzf flenvn-api.tar.gz
            npm ci --omit=dev --no-audit --no-fund
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
          EOF
